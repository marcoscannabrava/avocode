<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Each version is a git commit with trailers, a git note, a lineage file and a memory entry; trajectory files are gitignored"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">One version, three committed records</text><text x="24" y="48" class="s q">Example: v3 of the fuzzysearch bench. Only the lineage is committed; the trajectory is gitignored.</text><rect x="24" y="66" width="500" height="270" rx="8" class="dash"/><text x="40" y="88" class="s b q">LINEAGE · committed · what was kept</text><rect x="44" y="110" width="210" height="150" rx="8" class="hot"/><text x="60" y="134" class="b">git commit</text><text x="60" y="156" class="s">search: pigeonhole index</text><text x="60" y="184" class="m">Avo-Version: 3</text><text x="60" y="202" class="m">Avo-Score: {primary 0.408,</text><text x="60" y="218" class="m">  small 0.309, large 0.507}</text><text x="60" y="244" class="s q">the compact score avo commit reads</text><rect x="300" y="104" width="204" height="58" rx="8" class="box"/><text x="402" y="129" class="b mid">git notes --ref=avo</text><text x="402" y="147" class="s q mid">the full attempt behind the score</text><path d="M254 185C277 185 277 133 298 133" class="ln" marker-end="url(#a)"/><rect x="300" y="176" width="204" height="58" rx="8" class="box"/><text x="402" y="201" class="b mid">lineage/v003.md</text><text x="402" y="219" class="s q mid">score table, diffstat, parent, why</text><path d="M254 185C277 185 277 205 298 205" class="ln" marker-end="url(#a)"/><rect x="300" y="248" width="204" height="58" rx="8" class="box"/><text x="402" y="273" class="b mid">memory entry</text><text x="402" y="291" class="s q mid">why v3 was made, linked to v2</text><path d="M254 185C277 185 277 277 298 277" class="ln" marker-end="url(#a)"/><text x="44" y="300" class="s q">A refused candidate gets no commit, only a</text><text x="44" y="316" class="s q">dead-end memory entry keyed by its content.</text><rect x="544" y="66" width="192" height="270" rx="8" class="dash"/><text x="560" y="88" class="s b q">TRAJECTORY · gitignored</text><rect x="560" y="110" width="160" height="58" rx="8" class="box"/><text x="640" y="135" class="b mid">attempt log</text><text x="640" y="153" class="s q mid">every score, kept or not</text><rect x="560" y="182" width="160" height="58" rx="8" class="box"/><text x="640" y="207" class="b mid">probe worktrees</text><text x="640" y="225" class="s q mid">.avo/worktrees/</text><rect x="560" y="254" width="160" height="58" rx="8" class="box"/><text x="640" y="279" class="b mid">run logs</text><text x="640" y="297" class="s q mid">agent transcripts</text></svg>
