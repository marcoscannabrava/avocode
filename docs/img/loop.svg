<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="The avocode loop: agent, avo score, avo commit, avo supervise, and one shared store"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">The agent proposes; the score and the commit rule decide</text><path d="M175 120H205" class="ln" marker-end="url(#a)"/><path d="M355 120H385" class="ln" marker-end="url(#a)"/><path d="M535 120H565" class="ln" marker-end="url(#a)"/><path d="M640 84V62H100V84" class="ln" marker-end="url(#a)"/><path d="M460 156V260H355" class="ln" marker-end="url(#a)"/><path d="M100 232V156" class="ln" marker-end="url(#a)"/><text x="370" y="54" class="s q mid">next turn, fresh process, plus a directive if the loop is stuck</text><rect x="25" y="84" width="150" height="72" rx="8" class="box"/><text x="100" y="108" class="b mid">Agent</text><text x="100" y="126" class="s q mid">reads the past,</text><text x="100" y="142" class="s q mid">makes one change</text><rect x="205" y="84" width="150" height="72" rx="8" class="box"/><text x="280" y="108" class="b mid">avo score</text><text x="280" y="126" class="s q mid">runs .avo/score,</text><text x="280" y="142" class="s q mid">one JSON line out</text><rect x="385" y="84" width="150" height="72" rx="8" class="hot"/><text x="460" y="108" class="b mid">avo commit</text><text x="460" y="126" class="s q mid">keeps it only if</text><text x="460" y="142" class="s q mid">it beats the best</text><rect x="565" y="84" width="150" height="72" rx="8" class="box"/><text x="640" y="108" class="b mid">avo supervise</text><text x="640" y="126" class="s q mid">stuck, or going</text><text x="640" y="142" class="s q mid">in circles?</text><rect x="25" y="232" width="330" height="56" rx="8" class="store"/><text x="190" y="256" class="b mid">Lineage, memory, K</text><text x="190" y="274" class="s q mid">versions, dead ends, docs</text><text x="108" y="198" class="s q">read first</text><text x="470" y="200" class="s q">kept: a new version</text><text x="470" y="216" class="s q">refused: a dead end</text></svg>
