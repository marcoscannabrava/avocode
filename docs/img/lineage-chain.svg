<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="The fuzzysearch lineage from v0 to v7, with one refused candidate between v4 and v5"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">The fuzzysearch lineage: 7 versions, 1 dead end</text><text x="24" y="48" class="s q">Each version's parent is the best before it. A refused candidate is stored as memory, not as a version.</text><path d="M134 84V78H444V84" class="ln"/><text x="289" y="70" class="s q mid">Run 1 · 34 min</text><path d="M494 84V78H714V84" class="ln"/><text x="604" y="70" class="s q mid">Run 2 · 31 min</text><path d="M81 190H136" class="ln" marker-end="url(#a)"/><path d="M171 190H226" class="ln" marker-end="url(#a)"/><path d="M261 190H316" class="ln" marker-end="url(#a)"/><path d="M351 190H406" class="ln" marker-end="url(#a)"/><path d="M441 190H496" class="ln" marker-end="url(#a)"/><path d="M531 190H586" class="ln" marker-end="url(#a)"/><path d="M621 190H676" class="ln" marker-end="url(#a)"/><circle cx="64" cy="190" r="17" class="box" style="stroke-dasharray:3 3"/><text x="64" y="194" class="b mid">v0</text><text x="64" y="230" class="s mid">1,810 ms</text><text x="64" y="248" class="s q mid">nested-array</text><text x="64" y="263" class="s q mid">DP matrix</text><circle cx="154" cy="190" r="17" class="box" /><text x="154" y="194" class="b mid">v1</text><text x="154" y="230" class="s mid">6.85 ms</text><text x="154" y="248" class="s q mid">banded DP</text><circle cx="244" cy="190" r="17" class="box" /><text x="244" y="194" class="b mid">v2</text><text x="244" y="230" class="s mid">0.642 ms</text><text x="244" y="248" class="s q mid">bitmask</text><text x="244" y="263" class="s q mid">prefilter</text><circle cx="334" cy="190" r="17" class="box" /><text x="334" y="194" class="b mid">v3</text><text x="334" y="230" class="s mid">0.408 ms</text><text x="334" y="248" class="s q mid">pigeonhole</text><text x="334" y="263" class="s q mid">index</text><circle cx="424" cy="190" r="17" class="box" /><text x="424" y="194" class="b mid">v4</text><text x="424" y="230" class="s mid">0.345 ms</text><text x="424" y="248" class="s q mid">PassJoin</text><text x="424" y="263" class="s q mid">window</text><circle cx="514" cy="190" r="17" class="box" /><text x="514" y="194" class="b mid">v5</text><text x="514" y="230" class="s mid">0.331 ms</text><text x="514" y="248" class="s q mid">interleaved</text><text x="514" y="263" class="s q mid">index</text><circle cx="604" cy="190" r="17" class="box" /><text x="604" y="194" class="b mid">v6</text><text x="604" y="230" class="s mid">0.270 ms</text><text x="604" y="248" class="s q mid">Myers</text><text x="604" y="263" class="s q mid">bit-parallel</text><circle cx="694" cy="190" r="17" class="hot" /><text x="694" y="194" class="b mid">v7</text><text x="694" y="230" class="s mid">0.231 ms</text><text x="694" y="248" class="s q mid">no flat</text><text x="694" y="263" class="s q mid">buffer</text><rect x="377" y="98" width="184" height="46" rx="8" class="badbox"/><text x="469" y="117" class="s b mid bad">refused: interleaved entries</text><text x="469" y="134" class="s q mid">small 4.7% slower than v4</text><path d="M424 173C424 160 409 160 409 146" class="ln" marker-end="url(#a)"/><path d="M529 146C529 160 514 160 514 172" class="lnd" marker-end="url(#a)"/><text x="573" y="112" class="s q">Run 2 reached the</text><text x="573" y="127" class="s q">same idea again and</text><text x="573" y="142" class="s q">made it win as v5</text></svg>
