<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" role="img" aria-label="avo fan runs N probes in separate worktrees, then one is promoted, scored and committed"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">avo fan: N probes explore, one is promoted, the rule still decides</text><text x="24" y="48" class="s q">Same prompt, separate worktrees, a smaller model. Scores are an example.</text><rect x="24" y="150" width="120" height="60" rx="8" class="box"/><text x="84" y="168" class="b mid">HEAD</text><text x="84" y="186" class="s q mid">your working tree</text><text x="84" y="202" class="s q mid">stays untouched</text><path d="M144 180C170 180 170 94 196 94" class="ln" marker-end="url(#a)"/><rect x="198" y="72" width="176" height="44" rx="8" class="box"/><text x="214" y="91" class="b">probe 1 · worktree</text><text x="214" y="107" class="s q">avo score: 398 ms</text><path d="M144 180C170 180 170 154 196 154" class="ln" marker-end="url(#a)"/><rect x="198" y="132" width="176" height="44" rx="8" class="hot"/><text x="214" y="151" class="b">probe 2 · worktree</text><text x="214" y="167" class="s q">avo score: 356 ms · best</text><path d="M144 180C170 180 170 214 196 214" class="ln" marker-end="url(#a)"/><rect x="198" y="192" width="176" height="44" rx="8" class="box"/><text x="214" y="211" class="b">probe 3 · worktree</text><text x="214" y="227" class="s bad">avo score: fails correct</text><path d="M144 180C170 180 170 274 196 274" class="ln" marker-end="url(#a)"/><rect x="198" y="252" width="176" height="44" rx="8" class="box"/><text x="214" y="271" class="b">probe 4 · worktree</text><text x="214" y="287" class="s q">avo score: 412 ms</text><path d="M374 154H426" class="ln" marker-end="url(#a)"/><rect x="428" y="124" width="148" height="60" rx="8" class="box"/><text x="502" y="142" class="b m mid">avo fan --promote 2</text><text x="502" y="160" class="s q mid">applies the diff,</text><text x="502" y="176" class="s q mid">scores nothing</text><path d="M576 154H604" class="ln" marker-end="url(#a)"/><rect x="608" y="124" width="128" height="60" rx="8" class="hot"/><text x="672" y="142" class="b mid">avo score</text><text x="672" y="160" class="s q mid">then avo commit</text><text x="672" y="176" class="s q mid">applies the rule</text><text x="434" y="228" class="s q">Losing probes go to avo mem add,</text><text x="434" y="244" class="s q">so later sessions skip them.</text></svg>
