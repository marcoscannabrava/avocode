<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-label="knowledge/ and lineage/ are indexed by qmd so one avo know query searches both"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">One query searches the docs and the repo's own history</text><text x="24" y="48" class="s q">K is two markdown collections. Both are indexed together.</text><text x="24" y="117" class="m q">avo know search</text><text x="24" y="133" class="m q">--ingest</text><text x="24" y="197" class="m q">avo commit</text><text x="24" y="213" class="s q">(every version)</text><path d="M150 121H186" class="ln" marker-end="url(#a)"/><path d="M150 201H186" class="ln" marker-end="url(#a)"/><rect x="187" y="92" width="190" height="58" rx="8" class="box"/><text x="282" y="109" class="b mid">knowledge/</text><text x="282" y="127" class="s q mid">docs, papers, web pages</text><text x="282" y="143" class="s q mid">each with source + fetched-at</text><rect x="187" y="172" width="190" height="58" rx="8" class="box"/><text x="282" y="189" class="b mid">lineage/</text><text x="282" y="207" class="s q mid">vNNN.md, one per version</text><text x="282" y="223" class="s q mid">scores, why, dead ends</text><path d="M377 121C410 121 410 160 436 160" class="ln" marker-end="url(#a)"/><path d="M377 201C410 201 410 160 436 160" class="ln" marker-end="url(#a)"/><rect x="436" y="130" width="148" height="60" rx="8" class="store"/><text x="510" y="148" class="b mid">qmd index</text><text x="510" y="166" class="s q mid">keyword + vector</text><text x="510" y="182" class="s q mid">+ rerank</text><path d="M584 160H608" class="ln" marker-end="url(#a)"/><rect x="610" y="130" width="124" height="60" rx="8" class="hot"/><text x="672" y="148" class="b mid">one hit list</text><text x="672" y="166" class="s q mid">docs and past</text><text x="672" y="182" class="s q mid">attempts, ranked</text><text x="510" y="220" class="m mid">avo know query "&lt;idea&gt;"</text><text x="510" y="238" class="s q mid">no qmd: a local scan returns the same JSON</text></svg>
