<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="The commit rule: tie or beat the best on every config and win on at least one"><style>
svg{--ink:#1f2328;--quiet:#59636e;--edge:#8c959f;--accent:#0969da;--grid:#e6e9ec;--tint:#f6f8fa;--good:#1a7f37;--bad:#cf222e;--muted:#8c959f}
@media (prefers-color-scheme:dark){svg{--ink:#e6edf3;--quiet:#9198a1;--edge:#6e7681;--accent:#4493f8;--grid:#30363d;--tint:#161b22;--good:#3fb950;--bad:#f85149;--muted:#7d8590}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:var(--ink)}
.t{font-size:15px;font-weight:600}.b{font-weight:600}.s{font-size:11.5px}.q{fill:var(--quiet)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mid{text-anchor:middle}.end{text-anchor:end}
.box{fill:none;stroke:var(--edge);stroke-width:1.25}
.hot{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:2}
.store{fill:var(--tint);stroke:var(--edge);stroke-width:1.25}
.dash{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.badbox{fill:var(--bad);fill-opacity:.08;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.ln{fill:none;stroke:var(--edge);stroke-width:1.25}
.lnd{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 4}
.good{fill:var(--good)}.bad{fill:var(--bad)}.acc{fill:var(--accent)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><text x="24" y="26" class="t">avo commit keeps a candidate only if no config gets worse</text><text x="24" y="48" class="s q">Each candidate is compared to the current best, config by config. Same = within the noise floor.</text><text x="24" y="86" class="s q">candidate</text><text x="300" y="86" class="s q mid">small</text><text x="420" y="86" class="s q mid">large</text><text x="560" y="86" class="s q">decision</text><line x1="24" x2="736" y1="100" y2="100" stroke="var(--grid)"/><text x="24" y="131" class="">Faster on both configs</text><text x="300" y="131" class="b mid good">▼ faster</text><text x="420" y="131" class="b mid good">▼ faster</text><text x="560" y="131" class="b good">kept</text><text x="626" y="131" class="s q">beats the best on both</text><line x1="24" x2="736" y1="152" y2="152" stroke="var(--grid)"/><text x="24" y="183" class="">Same on small, faster on large</text><text x="300" y="183" class="b mid q">= same</text><text x="420" y="183" class="b mid good">▼ faster</text><text x="560" y="183" class="b good">kept</text><text x="626" y="183" class="s q">ties one, wins one (v5)</text><line x1="24" x2="736" y1="204" y2="204" stroke="var(--grid)"/><text x="24" y="235" class="">Faster on large, slower on small</text><text x="300" y="235" class="b mid bad">▲ slower</text><text x="420" y="235" class="b mid good">▼ faster</text><text x="560" y="235" class="b bad">refused</text><text x="626" y="235" class="s q">small regressed 4.7%</text><line x1="24" x2="736" y1="256" y2="256" stroke="var(--grid)"/><text x="24" y="287" class="">Same on both configs</text><text x="300" y="287" class="b mid q">= same</text><text x="420" y="287" class="b mid q">= same</text><text x="560" y="287" class="b bad">refused</text><text x="626" y="287" class="s q">no config improved</text><line x1="24" x2="736" y1="308" y2="308" stroke="var(--grid)"/></svg>
