name: qmd

# The qmd path of `avo know`, with a real `qmd` (#15). Kept off
# the main workflow: qmd pulls GGUF models (~2 GB) on first use.
# It runs nightly, on demand, and on a PR that touches the
# knowledge code or its e2e.
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - src/knowledge.ts
      - src/init.ts
      - test/e2e-know.sh
      - .github/workflows/qmd.yml

jobs:
  e2e-with-qmd:
    runs-on: ubuntu-latest
    env:
      # The version #15 and #16 were measured against.
      QMD_VERSION: "2.8.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install -g "@tobilu/qmd@$QMD_VERSION"
      - run: qmd --version
      # Models are large; reuse them across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/qmd/models
          key: qmd-models-${{ env.QMD_VERSION }}
      - run: ./test/e2e-know.sh
      # A SKIP here means qmd was not used: fail.
      - name: the qmd path ran
        run: |
          grep -q '^# qmd on PATH: yes' evidence/s4-e2e.txt
          if grep -q '^SKIP' evidence/s4-e2e.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s4-e2e-with-qmd
          path: evidence/s4-e2e.txt
