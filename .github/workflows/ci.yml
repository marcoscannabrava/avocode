name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      # apt gives 0.9.0, whose findings differ from 0.11.0's, so the version is read from
      # test/lint-sh.sh's own pin rather than named twice. `just lint` falls back to
      # `npm exec -- shellcheck` without this step; it is a speed-up, not a prerequisite,
      # and it is NOT what makes the gate real — see #2.
      - name: shellcheck (pinned to what test/lint-sh.sh expects)
        run: |
          ver="$(sed -n 's/^SC_PIN="\(.*\)"/\1/p' test/lint-sh.sh)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$ver/shellcheck-v$ver.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-v$ver/shellcheck" /usr/local/bin/
          shellcheck --version
      - run: just lint
      - run: just typecheck
      - run: just test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      # test/e2e-lint.sh drives the same gate, so it wants the same pinned binary.
      - name: shellcheck (pinned to what test/lint-sh.sh expects)
        run: |
          ver="$(sed -n 's/^SC_PIN="\(.*\)"/\1/p' test/lint-sh.sh)"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$ver/shellcheck-v$ver.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-v$ver/shellcheck" /usr/local/bin/
      # The e2e scripts need git and jq (both present on ubuntu-latest) and at least one agent CLI
      # for `doctor` to report ok; that acceptance case deliberately runs without them.
      - run: just e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: evidence/
