name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: just lint
      - run: just typecheck
      - run: just test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # test/e2e.sh needs jq (present on ubuntu-latest) and at least one agent CLI
      # for `doctor` to report ok; the acceptance case deliberately runs without them.
      - run: ./test/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s0-e2e-evidence
          path: evidence/
