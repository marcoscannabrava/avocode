name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      # `just lint` falls back to `npm exec -- shellcheck` when the binary is absent, so this
      # step is a speed-up, not a prerequisite. It is NOT what makes the gate real — see #2.
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: just lint
      - run: just typecheck
      - run: just test
      # The loop harness. Signals and process groups are exactly what differs between a
      # laptop and a runner, so the interrupt tests need to run where they can surprise us.
      - run: just ralph-test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: extractions/setup-just@v2
      # The e2e scripts need git and jq (both present on ubuntu-latest) and at least one agent CLI
      # for `doctor` to report ok; that acceptance case deliberately runs without them.
      - run: just e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: evidence/
